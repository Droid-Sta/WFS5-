<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>IMMO String Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #203a43, #2c5364);
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
            color: #fff; padding: 20px 10px;
        }
        .container {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; max-width: 500px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            margin-top: 10px; margin-bottom: 30px;
        }
        h1 { text-align: center; margin-bottom: 5px; font-size: 1.5rem; letter-spacing: 1px; }
        .subtitle { text-align: center; opacity: 0.8; margin-bottom: 20px; font-size: 0.9rem; }

        label { display: block; margin-top: 15px; font-size: 0.85rem; opacity: 0.9; color: #4a90e2; font-weight: 600; }
        
        input[type="text"], input[type="number"] {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff;
            font-size: 1rem; font-family: monospace; letter-spacing: 1px; outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #4a90e2; background: rgba(0,0,0,0.4); }
        
        /* Убираем стрелочки у input[type="number"] */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }

        button {
            width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4a90e2, #357abd); color: white;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        button:active { transform: scale(0.98); }
        
        .btn-success { background: linear-gradient(135deg, #28a745, #1e7e34); margin-top: 10px; display: none; }

        .result-container { margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .result-label { font-size: 0.9rem; margin-bottom: 8px; opacity: 0.8; }
        
        .result-box {
            background: rgba(0,0,0,0.4); border-radius: 10px; padding: 15px;
            font-family: monospace; font-size: 1.1rem; color: #fff; word-break: break-all;
            border-left: 3px solid #4a90e2; text-align: center; letter-spacing: 1px;
            min-height: 54px; display: flex; justify-content: center; align-items: center;
        }

        .error-msg { color: #dc3545; font-size: 0.85rem; margin-top: 5px; text-align: center; display: none; }
        
        /* Анимация для кнопки копирования */
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .copied { animation: flash 0.5s ease; background: linear-gradient(135deg, #1e7e34, #28a745) !important; }

        /* Стили для футера с авторами */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WFS 5</h1>
        <div class="subtitle">Конвертор CS 7 байт в CS 16 байт</div>

        <label for="in-cs">CS (14 символов)</label>
        <input type="text" id="in-cs" maxlength="14" placeholder="B1A0E8BA688B28" autocomplete="off" spellcheck="false">

        <label for="in-mac">MAC (8 символов)</label>
        <input type="text" id="in-mac" maxlength="8" placeholder="E401557F" autocomplete="off" spellcheck="false">

        <label for="in-pin">PIN (число)</label>
        <input type="number" id="in-pin" placeholder="52577" autocomplete="off">

        <label for="in-config">CONFIG (6 символов)</label>
        <input type="text" id="in-config" maxlength="6" placeholder="F13DDB" autocomplete="off" spellcheck="false">
        
        <div class="error-msg" id="error-msg">Ошибка ввода</div>

        <button id="btn-generate" onclick="generateString()">Сгенерировать</button>

        <div class="result-container">
            <div class="result-label">Сгенерированная строка (16 байт):</div>
            <div class="result-box" id="out-result">Ожидание...</div>
            <button class="btn-success" id="btn-copy" onclick="copyResult()">📋 Копировать</button>
        </div>

        <!-- Блок с авторами -->
        <div class="footer">
            Author: Ilya Ushakov,<br>the online version was created by Droid130
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        function showError(message) {
            const errBox = document.getElementById('error-msg');
            errBox.innerText = message;
            errBox.style.display = 'block';
            try { tg.HapticFeedback.notificationOccurred('error'); } catch(e) {}
        }

        function hideError() {
            document.getElementById('error-msg').style.display = 'none';
        }

        function generateString() {
            hideError();
            
            // Получаем значения и сразу переводим в верхний регистр
            let cs = document.getElementById('in-cs').value.trim().toUpperCase();
            let mac = document.getElementById('in-mac').value.trim().toUpperCase();
            let pin = document.getElementById('in-pin').value.trim();
            let config = document.getElementById('in-config').value.trim().toUpperCase();

            // Валидация CS (14 HEX символов)
            if (cs.length !== 14 || !/^[0-9A-F]+$/.test(cs)) {
                return showError('CS должен состоять ровно из 14 HEX-символов');
            }

            // Валидация MAC (8 HEX символов)
            if (mac.length !== 8 || !/^[0-9A-F]+$/.test(mac)) {
                return showError('MAC должен состоять ровно из 8 HEX-символов');
            }

            // Валидация CONFIG (6 HEX символов)
            if (config.length !== 6 || !/^[0-9A-F]+$/.test(config)) {
                return showError('CONFIG должен состоять ровно из 6 HEX-символов');
            }

            // Валидация PIN (Число от 0 до 65535)
            let pinInt = parseInt(pin, 10);
            if (isNaN(pinInt) || pinInt < 0 || pinInt > 65535) {
                return showError('PIN должен быть числом в диапазоне от 0 до 65535');
            }

            // --- Логика генерации ---
            // 1. Берем первые 4 символа MAC
            let macPart1 = mac.substring(0, 4);
            
            // 2. Берем последние 4 символа MAC
            let macPart2 = mac.substring(4, 8);
            
            // 3. Переводим PIN в HEX и дополняем нулями до 4 символов
            let pinHex = pinInt.toString(16).toUpperCase().padStart(4, '0');

            // 4. Собираем строку
            let resultStr = macPart1 + cs + macPart2 + pinHex + config;

            // Вывод
            document.getElementById('out-result').innerText = resultStr;
            document.getElementById('btn-copy').style.display = 'flex';
            
            try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
        }

        async function copyResult() {
            const resultText = document.getElementById('out-result').innerText;
            if (resultText === 'Ожидание...' || !resultText) return;

            try {
                await navigator.clipboard.writeText(resultText);
                
                // Визуальный отклик
                const btn = document.getElementById('btn-copy');
                const originalText = btn.innerText;
                btn.innerText = '✅ Скопировано!';
                btn.classList.add('copied');
                
                try { tg.HapticFeedback.impactOccurred('medium'); } catch(e) {}

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('copied');
                }, 1500);

            } catch (err) {
                alert('Не удалось скопировать текст');
            }
        }
    </script>
</body>
</html>
